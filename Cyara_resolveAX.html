<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ResolveAX Banner W850×H2000</title>
<style>
  :root {
    --w: 850px;
    --h: 2000px;
    --brand-blue: #0070c9;
    --brand-dark: #0a2239;
    --white: #ffffff;
  }

  html, body {
    margin: 0;
    background: #e9eef5;
    font-family: "Noto Sans JP", sans-serif;
  }

  /* ラップ全体を高さ固定に */
  .wrap {
    width: var(--w);
    height: var(--h);
    min-height: var(--h);
    margin: 0 auto;
    background: var(--white);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .banner { flex: 1; display: flex; flex-direction: column; }

  .header { text-align: center; padding: 20px 20px; background: var(--white); border-bottom: 4px solid var(--brand-blue); }
  .header img { height: 80px; }

  .hero-photo { position: relative; flex: 1; overflow: hidden; }
  .hero-photo img { width: 100%; height: 100%; object-fit: cover; }

  .hero-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    color: var(--white);
    padding: 120px 40px 180px;
  }

  .hero-overlay h1 {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.25;
    margin-bottom: 20px;
    letter-spacing: 0.02em;
    text-shadow: 0 0 14px rgba(0,0,0,0.6);
  }

  .hero-overlay p {
    font-size: 30px;
    line-height: 1.6;
    max-width: 740px;
    margin: 0 auto 20px;
    text-shadow: 0 0 12px rgba(0,0,0,0.6);
  }

  .hero-overlay .tag {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.06em;
    background: rgba(255,255,255,0.25);
    padding: 12px 30px;
    border-radius: 30px;
    display: inline-block;
    text-shadow: 0 0 12px rgba(0,0,0,0.5);
  }

  .footer {
    background: var(--brand-blue);
    padding: 60px 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--white);
    text-align: center;
  }

  .cta h4 {
    margin: 0 0 10px 0;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 0.02em;
  }

  .cta p {
    margin: 0;
    font-size: 22px;
    line-height: 1.6;
  }

  /* PDF出力時にも高さ維持 */
  @media print {
    @page { size: 850px 2000px; margin: 0; }
    html, body, .wrap { width: 850px; height: 2000px; min-height: 2000px; margin: 0; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .wrap { break-after: avoid; break-before: avoid; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="banner">
      <div class="header">
        <img src="https://cyara.com/nitropack_static/nxaPoUkYczufGHoRRwwjmdemgjOazrte/assets/images/source/rev-32ce72e/cyara.com/wp-content/uploads/2020/07/cyara-logo.svg" alt="Cyara ロゴ">
      </div>

      <div class="hero-photo">
        <img src="https://s3.ap-northeast-1.amazonaws.com/media.cc-arc.com/GPT/AdobeStock_166957611.jpeg" alt="ResolveAX 管理者視点イメージ">
        <div class="hero-overlay">
          <h1>情報システム部が<br>在宅エージェント環境を<br>見える化</h1>
          <div>
            <p>これまで把握しづらかった在宅エージェントの<br>通信品質や端末状況を<br>リアルタイムに監視・分析・通知</p>
            <div class="tag">対象：情シス／管理部門／センター長</div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="cta">
          <h4>ResolveAXで運用をスマートに</h4>
          <p>通話品質・端末・ネットワークを一元監視し<br>システム部門の負担を軽減</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
