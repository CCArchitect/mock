<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ResolveAX Banner W850×H2000</title>
<style>
  :root {
    --w: 850px;
    --h: 2000px;
    --brand-blue: #0070c9;
    --brand-dark: #0a2239;
    --white: #ffffff;
    --header-h: 140px; /* 固定 */
    --footer-h: 220px; /* 固定 */
  }

  html, body { margin: 0; background: #e9eef5; font-family: "Noto Sans JP", sans-serif; }

  /* すべてブロックレイアウト（flex不使用）に変更 */
  .wrap {
    width: var(--w);
    height: var(--h);
    min-height: var(--h);
    margin: 0 auto;
    background: var(--white);
    position: relative;
    overflow: hidden;
    page-break-inside: avoid;
  }

  .header {
    height: var(--header-h);
    line-height: var(--header-h);
    text-align: center;
    background: var(--white);
    border-bottom: 4px solid var(--brand-blue);
  }
  .header img { height: 80px; vertical-align: middle; }

  /* 画像は背景画像に（object-fit回避） */
  .hero {
    position: relative;
    width: 100%;
    height: calc(var(--h) - var(--header-h) - var(--footer-h));
    background-image: url('https://s3.ap-northeast-1.amazonaws.com/media.cc-arc.com/GPT/AdobeStock_166957611.jpeg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  /* うっすら暗幕（文字の可読性） */
  .hero::after{
    content:"";
    position:absolute; inset:0; background: rgba(0,0,0,0.25);
  }
  .hero-overlay{
    position:absolute; inset:0; display:block; text-align:center; color:#fff;
    padding: 120px 40px 180px; /* 上のキャッチ／下の説明にマージン */
  }
  .hero-overlay h1{
    font-size: 64px; font-weight: 900; line-height: 1.25; margin: 0 0 20px; letter-spacing: .02em;
    text-shadow: 0 0 14px rgba(0,0,0,.5);
  }
  .hero-overlay p{
    font-size: 30px; line-height: 1.6; max-width: 740px; margin: 0 auto 20px;
    text-shadow: 0 0 12px rgba(0,0,0,.5);
  }
  .hero-overlay .tag{
    display:inline-block; font-size: 24px; font-weight: 700; letter-spacing: .06em;
    background: rgba(255,255,255,.25); padding: 12px 30px; border-radius: 30px;
    text-shadow: 0 0 8px rgba(0,0,0,.4);
  }

  .footer{
    width: 100%; height: var(--footer-h); background: var(--brand-blue); color:#fff;
    text-align:center; display:block; padding: 40px 40px; box-sizing: border-box;
  }
  .cta h4{ margin:0 0 10px 0; font-size:38px; font-weight:900; letter-spacing:.02em; }
  .cta p{ margin:0; font-size:22px; line-height:1.6; }

  /* Acrobat/印刷用。物理サイズを固定し、ページ分割を抑制 */
  @media print{
    @page { size: 850px 2000px; margin: 0; }
    html, body { width: 850px; height: 2000px; margin: 0; background:#fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .wrap { width: 850px; height: 2000px; min-height: 2000px; margin: 0; page-break-before: avoid; page-break-after: avoid; }
    /* 背景を出力（Acrobatで出ない場合の保険） */
    .hero { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .hero-overlay h1, .hero-overlay p, .hero-overlay .tag { text-shadow: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img src="https://cyara.com/nitropack_static/nxaPoUkYczufGHoRRwwjmdemgjOazrte/assets/images/source/rev-32ce72e/cyara.com/wp-content/uploads/2020/07/cyara-logo.svg" alt="Cyara ロゴ" />
    </div>

    <div class="hero">
      <div class="hero-overlay">
        <h1>情報システム部が<br>在宅エージェント環境を<br>見える化</h1>
        <p>これまで把握しづらかった在宅エージェントの<br>通信品質や端末状況を<br>リアルタイムに監視・分析・通知</p>
        <div class="tag">対象：情シス／管理部門／センター長</div>
      </div>
    </div>

    <div class="footer">
      <div class="cta">
        <h4>ResolveAXで運用をスマートに</h4>
        <p>通話品質・端末・ネットワークを一元監視し<br>システム部門の負担を軽減</p>
      </div>
    </div>
  </div>
</body>
</html>
