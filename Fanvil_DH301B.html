<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ResolveAX Banner W850×H2000</title>
<style>
  :root{
    --w:850px; /* 固定幅 */
    --h:2000px; /* 固定高 */
    --brand-blue:#0070c9;
    --brand-dark:#0a2239;
    --white:#ffffff;
  }
  html,body{margin:0;background:#e9eef5;font-family:"Noto Sans JP",sans-serif;}

  /* ★ Acrobat対策：完全ブロック固定高。calc/flex/min-heightを使わない */
  .wrap{width:var(--w);height:var(--h);margin:0 auto;background:var(--white);position:relative;overflow:hidden;break-inside:avoid;page-break-inside:avoid;}

  .header{height:120px;line-height:120px;text-align:center;border-bottom:4px solid var(--brand-blue);}
  .header img{height:80px;vertical-align:middle}

  /* ヒーロー領域は絶対pxで固定 */
  .hero{position:relative;width:100%;height:1640px;overflow:hidden;}
  .hero img{display:block;width:100%;height:100%;object-fit:cover;}
  .hero::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25);} /* 暗幕 */

  .hero-overlay{position:absolute;inset:0;color:#fff;text-align:center;padding:120px 40px 180px;}
  .hero-overlay h1{font-size:64px;font-weight:900;line-height:1.25;margin:0 0 20px;letter-spacing:.02em;text-shadow:0 0 14px rgba(0,0,0,.5)}
  .hero-overlay p{font-size:30px;line-height:1.6;max-width:740px;margin:0 auto 20px;text-shadow:0 0 12px rgba(0,0,0,.5)}
  .hero-overlay .tag{display:inline-block;font-size:24px;font-weight:700;letter-spacing:.06em;background:rgba(255,255,255,.25);padding:12px 30px;border-radius:30px;text-shadow:0 0 8px rgba(0,0,0,.4)}

  .footer{height:240px;background:var(--brand-blue);color:#fff;text-align:center;box-sizing:border-box;padding:40px}
  .cta h4{margin:0 0 10px 0;font-size:38px;font-weight:900;letter-spacing:.02em}
  .cta p{margin:0;font-size:22px;line-height:1.6}

  /* ★ Acrobat/印刷：物理サイズ固定。@media printが無視されるケースもあるため@pageと本体両方にpxで指定 */
  @page{size:850px 2000px;margin:0}
  @media print{
    html,body{width:850px;height:2000px;margin:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .wrap{width:850px;height:2000px;margin:0;break-before:avoid;break-after:avoid}
    .hero::after{background:rgba(0,0,0,.2)}
    .hero-overlay h1,.hero-overlay p,.hero-overlay .tag{text-shadow:none}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img src="https://cyara.com/nitropack_static/nxaPoUkYczufGHoRRwwjmdemgjOazrte/assets/images/source/rev-32ce72e/cyara.com/wp-content/uploads/2020/07/cyara-logo.svg" alt="Cyara ロゴ" />
    </div>

    <div class="hero">
      <img src="https://s3.ap-northeast-1.amazonaws.com/media.cc-arc.com/GPT/AdobeStock_166957611.jpeg" alt="ResolveAX 管理者視点イメージ">
      <div class="hero-overlay">
        <h1>情報システム部が<br>在宅エージェント環境を<br>見える化</h1>
        <p>これまで把握しづらかった在宅エージェントの<br>通信品質や端末状況を<br>リアルタイムに監視・分析・通知</p>
        <div class="tag">対象：情シス／管理部門／センター長</div>
      </div>
    </div>

    <div class="footer">
      <div class="cta">
        <h4>ResolveAXで運用をスマートに</h4>
        <p>通話品質・端末・ネットワークを一元監視し<br>システム部門の負担を軽減</p>
      </div>
    </div>
  </div>
</body>
</html>
